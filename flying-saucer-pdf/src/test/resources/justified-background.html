<!DOCTYPE html>
<html lang="en">
<head>
    <title>justified background</title>
    <style>
        @page { margin: 0; }
        body { margin: 0; font-size: 12px; }
        p { width: 200px; text-align: justify; margin: 0; }
        span { background-color: yellow; }
    </style>
</head>
<body>
    <p><span>alpha beta gamma delta epsilon zeta eta theta iota kappa lambda mu nu xi omicron pi rho sigma tau upsilon phi chi psi omega</span></p>
    <p><span>alpha beta gamma</span> delta epsilon zeta eta theta iota kappa lambda mu</p>
</body>
</html>
