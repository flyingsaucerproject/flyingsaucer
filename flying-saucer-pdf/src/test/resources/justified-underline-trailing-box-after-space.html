<!DOCTYPE html>
<html lang="en">
<head>
    <title>justified underline of a line ending in a box after a space</title>
    <style>
        @page { margin: 0; }
        body { margin: 0; font-size: 36px; }
        /* Two digits, a no-break space and the inline-block fit a line, a third digit does not, so
           the first line ends with the inline-block, after a space that survives the line break. */
        p { width: 100px; text-align: justify; margin: 0; word-wrap: break-word; }
        i { display: inline-block; width: 50px; height: 10px; background: red; }
    </style>
</head>
<body>
    <p><u>12&#160;<i></i>345678</u></p>
</body>
</html>
