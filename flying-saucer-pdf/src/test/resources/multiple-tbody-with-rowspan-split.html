<html>
<head>
  <style>
    table {
      -fs-table-paginate: paginate;
      width: 100%;
    }
    td {
      border: 1px solid gray;
    }
  </style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Age</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">Left 1</td>
      <td height="300px">Right 1.a</td>
    </tr>
    <tr>
      <td height="300px">Right 1.b</td>
    </tr>
  </tbody>
  <tbody>
    <tr>
      <td rowspan="2">Left 2</td>
      <td height="300px">Right 2.a</td>
    </tr>
    <tr>
      <td height="300px">Right 2.b</td>
    </tr>
  </tbody>
</table>
</body>
</html>
