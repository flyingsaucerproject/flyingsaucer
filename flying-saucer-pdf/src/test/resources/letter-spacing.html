<html lang="en">
<head>
    <title>letter-spacing</title>
    <style>
        body { font-size: 12px; }
        .wide { letter-spacing: 0.25em; }
        .tight { letter-spacing: -1px; }
    </style>
</head>
<body>
    <p>Hello</p>
    <p class="wide">Wide</p>
    <p class="tight">Tight</p>
</body>
</html>
